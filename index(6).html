<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pádel Point Gestión</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <section id="auth-view" class="center-screen">
    <div class="login-card">
      <h1>PÁDEL POINT</h1>
      <p>Gestión integral</p>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Contraseña" />
      <button id="login-btn">Ingresar</button>
      <div id="login-error" class="error"></div>
    </div>
  </section>

  <section id="main-view" class="hidden">
    <aside class="sidebar">
      <div class="brand">PÁDEL POINT</div>

      <nav>
        <button data-page="dashboard">Inicio</button>
        <button data-page="planner">Planner</button>
        <button data-page="clases">Clases</button>
        <button data-page="abiertas">Canchas abiertas</button>
        <button data-page="torneos">Torneos propios</button>
        <button data-page="terceros">Torneos de terceros</button>
        <button data-page="corporativos">Eventos corporativos</button>
        <button data-page="personas">Alumnos y profesores</button>
        <button class="admin-only" data-page="finanzas">Finanzas</button>
        <button class="admin-only" data-page="reportes">Reportes</button>
      </nav>

      <button id="logout-btn" class="logout">Salir</button>
    </aside>

    <main class="content">
      <div class="topbar">
        <h2 id="page-title">Inicio</h2>
        <span id="role-pill"></span>
      </div>

      <div id="page-content"></div>
    </main>
  </section>

  <div id="modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 id="modal-title"></h3>

      <div id="modal-fields" class="form-grid"></div>

      <div class="modal-actions">
        <button id="cancel-modal" class="btn secondary">Cancelar</button>
        <button id="save-modal" class="btn">Guardar</button>
      </div>
    </div>
  </div>
</body>
</html>
